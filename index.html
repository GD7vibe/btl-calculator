<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#0d0f18"/>
  <title>BuTLer — UK Buy-to-Let Tax Calculator</title>
  <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{background:#0d0f18;color:#eaeaea;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100%}
    input{-webkit-appearance:none;-moz-appearance:none;appearance:none;box-shadow:none!important;-webkit-box-shadow:none!important;outline:none;font-family:inherit}
    input:focus{box-shadow:none!important;-webkit-box-shadow:none!important}
    button{-webkit-appearance:none;font-family:inherit;cursor:pointer}
    *{-webkit-tap-highlight-color:transparent}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:#0d0f18}
    ::-webkit-scrollbar-thumb{background:#252836;border-radius:2px}

    /* ── Layout ── */
    #app{min-height:100vh}
    .header{background:#161923;border-bottom:1px solid #252836;padding:14px 16px 12px}
    .header-inner{display:flex;align-items:center;gap:10;max-width:1200px;margin:0 auto}
    .header-logo{font-size:22px}
    .header-title{font-size:16px;font-weight:700;color:#c9a84c;line-height:1.2}
    .header-sub{font-size:10px;color:#7a7f96}
    .header-net-label{font-size:10px;color:#7a7f96;text-align:right}
    .header-net-val{font-size:18px;font-weight:800;font-family:monospace;text-align:right}
    .header-tabs{display:none;gap:8px;align-items:center;margin-left:auto}
    .header-right{margin-left:auto;text-align:right}

    .body{padding:14px 14px 0}
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#161923;border-top:1px solid #252836;display:flex;z-index:100}
    .nav-btn{flex:1;background:transparent;border:none;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px}
    .nav-icon{font-size:20px}
    .nav-label{font-size:10px;font-weight:400}
    .nav-bar{width:24px;height:2px;background:#c9a84c;border-radius:2px;display:none}

    /* ── Desktop ── */
    @media(min-width:800px){
      .header{padding:16px 32px}
      .header-logo{font-size:26px}
      .header-title{font-size:20px}
      .header-sub{font-size:12px}
      .header-tabs{display:flex}
      .header-right{display:none}
      .desktop-net{display:block!important}
      .body{max-width:1200px;margin:0 auto;padding:24px 32px 32px;display:flex;gap:24;align-items:flex-start}
      .col-left{flex:0 0 420px;min-width:0}
      .col-right{flex:1;min-width:0}
      .bottom-nav{display:none}
      .mobile-only{display:none!important}
      #page-inputs{display:block!important}
    }
    @media(max-width:799px){
      .col-left,.col-right{width:100%}
      .desktop-net{display:none!important}
      .desktop-only{display:none!important}
    }

    /* ── Components ── */
    .card{background:#161923;border:1.5px solid #252836;border-radius:12px;padding:14px;margin-bottom:12px}
    .card.gold{border-color:#7a6030}
    .card-title{display:flex;align-items:center;gap:6px;margin-bottom:12px}
    .card-title-icon{font-size:14px}
    .card-title-text{color:#5b8dee;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
    .card-title-text.gold{color:#c9a84c}

    .field{margin-bottom:12px}
    .field-label{display:block;color:#7a7f96;font-size:11px;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
    .field-wrap{display:flex;align-items:stretch;background:#0f1120;border:1.5px solid #252836;border-radius:8px;overflow:hidden;transition:border-color .15s}
    .field-wrap.focused{border-color:#c9a84c}
    .field-pre{display:flex;align-items:center;padding:0 12px;color:#c9a84c;font-weight:bold;font-size:15px;border-right:1px solid #252836;background:#0d0f18;min-width:36px;justify-content:center;flex-shrink:0}
    .field-input{flex:1;background:transparent;border:none;outline:none;color:#eaeaea;padding:13px 12px;font-size:16px;font-family:monospace;min-width:0;caret-color:#c9a84c}
    .field-suf{display:flex;align-items:center;padding:0 10px;color:#7a7f96;font-size:12px;border-left:1px solid #252836;white-space:nowrap;flex-shrink:0}
    .field-note{color:#7a7f96;font-size:11px;margin-top:4px;line-height:1.4}

    .picker{margin-bottom:12px}
    .picker-label{display:block;color:#7a7f96;font-size:11px;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
    .picker-btns{display:flex;gap:6px}
    .picker-btn{flex:1;padding:11px 6px;font-size:12px;font-weight:bold;border-radius:8px;border:1.5px solid #252836;background:#0f1120;color:#7a7f96;transition:all .15s}
    .picker-btn.active{border-color:#c9a84c;background:#c9a84c22;color:#c9a84c}

    .tip{border-radius:8px;padding:10px 11px;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
    .tip-icon{font-size:12px;margin-top:1px;flex-shrink:0}
    .tip-text{font-size:12px;line-height:1.55;color:#eaeaea}
    .tip.info{background:#5b8dee12;border:1px solid #5b8dee40}.tip.info .tip-icon{color:#5b8dee}
    .tip.warn{background:#e08a2a12;border:1px solid #e08a2a40}.tip.warn .tip-icon{color:#e08a2a}
    .tip.good{background:#3dba8212;border:1px solid #3dba8240}.tip.good .tip-icon{color:#3dba82}

    .line{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
    .line.indent{padding-left:10px}
    .line-label{font-size:12px;font-weight:400;padding-right:8px;line-height:1.3;color:#eaeaea}
    .line-label.muted{color:#7a7f96}
    .line-label.bold{font-size:14px;font-weight:700}
    .line-val{font-size:12px;font-weight:400;font-family:monospace;white-space:nowrap;color:#eaeaea}
    .line-val.bold{font-size:14px;font-weight:700}
    .line-val.green{color:#3dba82}.line-val.red{color:#e05555}.line-val.accent{color:#c9a84c}
    .hr{border-top:1px solid #252836;margin:7px 0}

    .chip{border-radius:5px;padding:3px 8px;font-size:10px;font-weight:700;text-transform:uppercase}
    .chip.green{background:#3dba8220;color:#3dba82;border:1px solid #3dba8250}
    .chip.red{background:#e0555520;color:#e05555;border:1px solid #e0555550}
    .chip.amber{background:#e08a2a20;color:#e08a2a;border:1px solid #e08a2a50}
    .chip.accent{background:#c9a84c20;color:#c9a84c;border:1px solid #c9a84c50}

    .acc{border:1px solid #252836;border-radius:8px;margin-bottom:7px;overflow:hidden}
    .acc-hdr{width:100%;background:transparent;border:none;padding:12px;display:flex;justify-content:space-between;align-items:center}
    .acc-hdr.open{background:#c9a84c15}
    .acc-hdr-text{font-size:13px;font-weight:600;text-align:left;color:#eaeaea}
    .acc-hdr-text.open{color:#c9a84c}
    .acc-num{color:#7a6030;margin-right:6px;font-size:10px}
    .acc-arrow{color:#7a7f96;font-size:13px;margin-left:8px;flex-shrink:0}
    .acc-body{padding:0 12px 12px}

    .hero{border-radius:14px;padding:16px;margin-bottom:12px;text-align:center}
    .hero-label{font-size:11px;color:#7a7f96;margin-bottom:4px;text-transform:uppercase;letter-spacing:.07em}
    .hero-val{font-size:42px;font-weight:800;font-family:monospace;line-height:1}
    .hero-sub{font-size:12px;color:#7a7f96;margin-top:6px}
    .hero-chips{margin-top:10px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}

    .tab-btn{background:transparent;border:1.5px solid #252836;border-radius:8px;padding:8px 20px;color:#7a7f96;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;transition:all .15s}
    .tab-btn.active{background:#c9a84c22;border-color:#c9a84c;color:#c9a84c}

    .calc-btn{width:100%;background:#c9a84c;color:#000;border:none;border-radius:10px;padding:15px;font-size:16px;font-weight:700;margin-bottom:4px}

    .score-row{display:flex;align-items:center;gap:10px;padding:7px 0}
    .score-icon{font-size:16px;flex-shrink:0}
    .score-label{font-size:13px}

    .be-box{background:#0f1120;border-radius:10px;padding:14px;text-align:center;margin-bottom:8px}
    .be-label{font-size:10px;color:#7a7f96;margin-bottom:4px;text-transform:uppercase}
    .be-val{font-size:34px;font-weight:800;color:#c9a84c;font-family:monospace}
    .be-mo{font-size:13px;color:#7a7f96}
    .be-pct{font-size:12px;color:#7a7f96;margin-top:4px}

    .disclaimer{background:#161923;border:1px solid #252836;border-radius:10px;padding:12px;font-size:10px;color:#7a7f96;line-height:1.6;margin-bottom:4px}
    .disclaimer strong{color:#7a6030}

    .desktop-net-box{background:#0e2419;border:1px solid #3dba8250;border-radius:10px;padding:8px 18px;text-align:center;margin-left:16px}
    .desktop-net-box.loss{background:#2a0e0e;border-color:#e0555550}
    .desktop-net-label{font-size:10px;color:#7a7f96;text-transform:uppercase;letter-spacing:.06em}
    .desktop-net-val{font-size:22px;font-weight:800;font-family:monospace}
    .pdf-btn{background:#c9a84c;color:#000;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
    .pdf-btn:hover{background:#e0bc6a}
  </style>
</head>
<body>
<div id="app"></div>
<script>
// ── State ──
const state = {
  tab:0,
  rentPCM:1500, propVal:200000, otherIncome:30000,
  mortPCM:800, mortRate:5.5, mortType:"io", repayInt:0,
  structure:"personal",
  agentPct:10, insurePCM:40, repairsPA:600, groundPA:0, otherExpPA:200,
  acc:{} // accordion open states
};

// ── Tax helpers ──
function calcTax(income){
  const pa=income>100000?Math.max(0,12570-(income-100000)/2):12570;
  const t=Math.max(0,income-pa);
  if(t<=37700)return t*.2;
  if(t<=125140)return 37700*.2+(t-37700)*.4;
  return 37700*.2+(125140-37700)*.4+(t-125140)*.45;
}
function margRate(inc){
  if(inc<=12570)return 0;if(inc<=50270)return 20;
  if(inc<=100000)return 40;if(inc<=125140)return 60;return 45;
}
function fmt(n){
  return n<0?`-£${Math.abs(n).toLocaleString("en-GB",{minimumFractionDigits:0,maximumFractionDigits:0})}`:
    `£${n.toLocaleString("en-GB",{minimumFractionDigits:0,maximumFractionDigits:0})}`;
}
function pct(n){return`${n.toFixed(1)}%`}

// ── Calculate results ──
function calc(){
  const {rentPCM,propVal,otherIncome,mortPCM,mortRate,mortType,repayInt,structure,agentPct,insurePCM,repairsPA,groundPA,otherExpPA}=state;
  const rentA=rentPCM*12,mortA=mortPCM*12;
  const interestA=mortType==="io"?mortA:repayInt;
  const agentFees=rentA*(agentPct/100),insure=insurePCM*12;
  const otherExp=repairsPA+groundPA+otherExpPA;
  const totalExp=agentFees+insure+otherExp;
  let taxableProfit,taxCredit,tax,corpTax;
  if(structure==="ltd"){
    taxableProfit=rentA-totalExp-interestA;
    corpTax=taxableProfit<=0?0:taxableProfit<=50000?taxableProfit*.19:taxableProfit<=250000?taxableProfit*.25-(250000-taxableProfit)*(3/200):taxableProfit*.25;
    taxCredit=0;tax=corpTax;
  }else{
    taxableProfit=rentA-totalExp;
    const pa=(otherIncome+taxableProfit)>100000?Math.max(0,12570-((otherIncome+taxableProfit)-100000)/2):12570;
    const abovePA=Math.max(0,otherIncome+taxableProfit-pa);
    const creditBase=Math.min(interestA,Math.max(0,taxableProfit),abovePA);
    taxCredit=creditBase*.2;
    const rentalTax=Math.max(0,calcTax(otherIncome+taxableProfit)-calcTax(otherIncome));
    tax=Math.max(0,rentalTax-taxCredit);corpTax=0;
  }
  const grossCF=rentA-mortA-totalExp,netCF=grossCF-tax,netPCM=netCF/12;
  const grossYield=(rentA/propVal)*100,netYield=(netCF/propVal)*100;
  const totalIncome=structure==="ltd"?otherIncome:otherIncome+taxableProfit;
  const mr=margRate(totalIncome);
  let s24Penalty=0;
  if(structure==="personal"){
    const oldP=Math.max(0,rentA-totalExp-interestA);
    s24Penalty=tax-Math.max(0,calcTax(otherIncome+oldP)-calcTax(otherIncome));
  }
  let beMortPCM=0;
  for(let m=0;m<=rentPCM;m+=10){
    const mA=m*12,intA2=mortType==="io"?mA:propVal*(mortRate/100);let t2;
    if(structure==="ltd"){const p2=rentA-totalExp-intA2;t2=p2<=0?0:p2*.19;}
    else{const p2=rentA-totalExp;const pa2=(otherIncome+p2)>100000?Math.max(0,12570-((otherIncome+p2)-100000)/2):12570;const ab2=Math.max(0,otherIncome+p2-pa2);const cb2=Math.min(intA2,Math.max(0,p2),ab2);const rt2=Math.max(0,calcTax(otherIncome+p2)-calcTax(otherIncome));t2=Math.max(0,rt2-cb2*.2);}
    if(rentA-mA-totalExp-t2>=0)beMortPCM=m;else break;
  }
  const beMortPct=rentPCM>0?(beMortPCM/rentPCM)*100:0;
  let ltdSaving=null;
  if(structure==="personal"){const lp=rentA-totalExp-interestA;const lc=lp<=0?0:lp<=50000?lp*.19:lp*.25;ltdSaving=(rentA-mortA-totalExp-lc)-netCF;}
  return{rentA,mortA,interestA,agentFees,insure,otherExp,totalExp,taxableProfit,taxCredit,tax,corpTax,grossCF,netCF,netPCM,grossYield,netYield,marginalRate:mr,s24Penalty,beMortPCM,beMortPct,ltdSaving};
}

// ── HTML builders ──
function h(tag,attrs,inner){
  const a=Object.entries(attrs||{}).map(([k,v])=>`${k}="${v}"`).join(" ");
  return`<${tag}${a?" "+a:""}>${inner||""}</${tag}>`;
}

function field(id,label,value,pre,suf,note){
  return`<div class="field">
    <label class="field-label">${label}</label>
    <div class="field-wrap" id="fw-${id}">
      ${pre!==undefined?`<span class="field-pre">${pre}</span>`:""}
      <input class="field-input" type="text" inputmode="numeric" autocomplete="off" id="fi-${id}" value="${value==="0"||value===0?"":value}" placeholder="0"
        onfocus="fieldFocus('${id}',this)" onblur="fieldBlur('${id}',this)" oninput="fieldInput('${id}',this)">
      ${suf?`<span class="field-suf">${suf}</span>`:""}
    </div>
    ${note?`<p class="field-note">${note}</p>`:""}
  </div>`;
}

function picker(id,label,value,options){
  return`<div class="picker">
    <label class="picker-label">${label}</label>
    <div class="picker-btns">
      ${options.map(o=>`<button class="picker-btn${value===o.v?" active":""}" onclick="pick('${id}','${o.v}')">${o.l}</button>`).join("")}
    </div>
  </div>`;
}

function card(title,icon,inner,gold){
  return`<div class="card${gold?" gold":""}">
    ${title?`<div class="card-title"><span class="card-title-icon">${icon}</span><span class="card-title-text${gold?" gold":""}">${title}</span></div>`:""}
    ${inner}
  </div>`;
}

function tip(text,type){
  const icon=type==="warn"?"⚠":type==="good"?"✓":"ℹ";
  return`<div class="tip ${type||"info"}"><span class="tip-icon">${icon}</span><span class="tip-text">${text}</span></div>`;
}

function line(label,value,color,bold,indent,hr){
  return`${hr?`<div class="hr"></div>`:""}
  <div class="line${indent?" indent":""}">
    <span class="line-label${indent?" muted":""}${bold?" bold":""}">${label}</span>
    <span class="line-val${bold?" bold":""}${color?" "+color:""}">${value}</span>
  </div>`;
}

function chip(text,color){return`<span class="chip ${color}">${text}</span>`}

function acc(id,num,title,inner){
  const open=state.acc[id];
  return`<div class="acc">
    <button class="acc-hdr${open?" open":""}" onclick="toggleAcc('${id}')">
      <span class="acc-hdr-text${open?" open":""}"><span class="acc-num">${num}</span>${title}</span>
      <span class="acc-arrow">${open?"▲":"▼"}</span>
    </button>
    ${open?`<div class="acc-body">${inner}</div>`:""}
  </div>`;
}

// ── Panels ──
function inputsHTML(){
  const s=state;
  return`
    ${card("Property & Income","🏘",
      field("rentPCM","Monthly Rent",s.rentPCM,"£","per month")+
      field("propVal","Property Value",s.propVal,"£","")+
      field("otherIncome","Other Annual Income",s.otherIncome,"£","","Salary, pension etc — determines your marginal tax rate")
    )}
    ${card("Mortgage","🏦",
      field("mortPCM","Monthly Mortgage Payment",s.mortPCM,"£","per month")+
      field("mortRate","Interest Rate",s.mortRate,"%","per annum")+
      picker("mortType","Mortgage Type",s.mortType,[{v:"io",l:"Interest Only"},{v:"repay",l:"Repayment"}])+
      (s.mortType==="repay"?
        field("repayInt","Annual Interest Paid",s.repayInt,"£","per year","Exact figure from your annual mortgage statement — only interest qualifies for Section 24 relief.")+
        tip("This figure reduces each year as your capital balance falls. Update it annually before filing self-assessment.","warn")
      :"")
    )}
    ${card("Allowable Expenses","📋",
      field("agentPct","Letting Agent Fees",s.agentPct,"%","of rent","Fully deductible from taxable profit")+
      field("insurePCM","Landlord Insurance",s.insurePCM,"£","per month")+
      field("repairsPA","Repairs & Maintenance",s.repairsPA,"£","per year","Like-for-like repairs only — improvements are not deductible")+
      field("groundPA","Ground Rent / Service Charge",s.groundPA,"£","per year")+
      field("otherExpPA","Other Expenses",s.otherExpPA,"£","per year","Accountancy, mileage, advertising")
    )}
    ${card("Ownership Structure","🏛",
      picker("structure","Property held in",s.structure,[{v:"personal",l:"Personal Name"},{v:"ltd",l:"Ltd Company"}])+
      (s.structure==="personal"?tip("Section 24 applies — you only get a 20% tax credit on mortgage interest. At 40% tax you're losing half your interest relief to HMRC.","warn"):"")+
      (s.structure==="ltd"?tip("Companies deduct 100% of mortgage interest before tax. Corp tax 19–25%. Extracting profit as dividends adds further personal tax.","good"):"")
    )}`;
}

function resultsHTML(r,structure){
  const profitable=r.netCF>0;
  return`
    <div class="hero" style="background:${profitable?"#0e2419":"#2a0e0e"};border:1.5px solid ${profitable?"#3dba82":"#e05555"}60">
      <div class="hero-label">Monthly Net Cashflow After Tax</div>
      <div class="hero-val" style="color:${profitable?"#3dba82":"#e05555"}">${fmt(r.netPCM)}</div>
      <div class="hero-sub">${fmt(r.netCF)} per year</div>
      <div class="hero-chips">
        ${chip(profitable?"Profitable":"Loss-making",profitable?"green":"red")}
        ${chip("Gross "+pct(r.grossYield),r.grossYield>=5?"green":"amber")}
        ${chip("Net "+pct(r.netYield),r.netYield>3?"green":r.netYield>0?"amber":"red")}
      </div>
    </div>
    ${card("Income & Expenses (Annual)","💷",
      line("Gross Rent",fmt(r.rentA),"accent",true)+
      line("Agent Fees","-"+fmt(r.agentFees),"red",false,true)+
      line("Insurance","-"+fmt(r.insure),"red",false,true)+
      line("Repairs & Other","-"+fmt(r.otherExp),"red",false,true)+
      line("Total Deductible Expenses","-"+fmt(r.totalExp),"",true,false,true)+
      (structure==="ltd"?line("Mortgage Interest","-"+fmt(r.interestA),"red",false,true):"")+
      line("Taxable Profit",fmt(r.taxableProfit),r.taxableProfit>0?"accent":"red",true,false,true)
    )}
    ${card("Tax Calculation","🧾",
      structure==="personal"?
        line("Your Marginal Rate",r.marginalRate+"%")+
        line("Income Tax on Rental",fmt(r.tax+r.taxCredit),"red")+
        line("Section 24 Credit (20%)","-"+fmt(r.taxCredit),"green")+
        line("Net Tax Liability",fmt(r.tax),"red",true,false,true)+
        (r.s24Penalty>0?tip(`Section 24 costs you ${fmt(r.s24Penalty)}/yr extra vs pre-2017 rules — ${fmt(r.s24Penalty/12)}/mo straight to HMRC.`,"warn"):"")
      :
        line("Corporation Tax",fmt(r.corpTax),"red",true)+
        tip("19% on profits up to £50k, up to 25% above £250k. Full mortgage interest deductibility is the key advantage.","info")
    )}
    ${card("Cashflow Summary","💰",
      line("Gross Rent",fmt(r.rentA))+
      line("Mortgage Payments","-"+fmt(r.mortA),"red")+
      line("Running Expenses","-"+fmt(r.totalExp),"red")+
      line("Gross CF (pre-tax)",fmt(r.grossCF),r.grossCF>0?"accent":"red",true,false,true)+
      line("Tax","-"+fmt(r.tax),"red")+
      line("Net Annual Cashflow",fmt(r.netCF),profitable?"green":"red",true,false,true)+
      line("Net Monthly Cashflow",fmt(r.netPCM),profitable?"green":"red",true)
    )}
    ${card("Key Ratios","📐",
      line("Gross Yield",pct(r.grossYield),r.grossYield>=5?"green":"accent")+
      line("Net Yield",pct(r.netYield),r.netYield>3?"green":r.netYield>0?"accent":"red")+
      line("Mortgage as % of Rent",pct((r.mortA/r.rentA)*100))+
      line("Break-even Mortgage (PCM)",fmt(r.beMortPCM),"accent",true)+
      line("Break-even as % of Rent",pct(r.beMortPct),"accent")+
      line("Effective Tax on Gross Rent",pct(r.rentA>0?(r.tax/r.rentA)*100:0))
    )}`;

function exportPDF(){
  if(!window.jspdf){alert('PDF library still loading — please try again in a moment.');return;}

  const doc = new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const r = calc();
  const {structure,rentPCM,propVal,otherIncome,mortPCM,mortRate,mortType,repayInt,agentPct,insurePCM,repairsPA,groundPA,otherExpPA} = state;
  const profitable = r.netCF > 0;
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
  const W=210, M=12, CW=W-M*2;
  let y=0;

  // ── Colour palette: light background, dark text ──
  const BLACK=[30,30,35], DARK=[55,60,70], MID=[100,105,115], LIGHT=[150,155,165];
  const GOLD=[180,140,40], GREEN=[40,140,80], RED=[180,55,55], BLUE=[60,100,180];
  const BG_PAGE=[252,252,250];        // near-white page
  const BG_HEADER=[245,243,235];      // very pale gold for section headers
  const BG_ALT=[246,247,249];         // barely-there blue-grey for alt rows
  const BG_HERO_G=[235,248,240];      // pale green hero
  const BG_HERO_R=[250,238,238];      // pale red hero
  const BORDER=[210,212,218];         // subtle border

  // Page background
  function pageBG(){
    doc.setFillColor(BG_PAGE[0],BG_PAGE[1],BG_PAGE[2]);
    doc.rect(0,0,W,297,'F');
  }
  pageBG();

  function newPage(){
    doc.addPage();
    pageBG();
    y=10;
  }

  function checkPage(need){
    if(y+need>282){newPage();return true;}
    return false;
  }

  // ── Section header ──
  function secHead(title, color){
    checkPage(10);
    y+=2;
    doc.setFillColor(BG_HEADER[0],BG_HEADER[1],BG_HEADER[2]);
    doc.rect(M,y,CW,7,'F');
    const cc=color||BLUE;
    doc.setFillColor(cc[0],cc[1],cc[2]);
    doc.rect(M,y,2.5,7,'F');
    doc.setFontSize(7.5);doc.setFont('helvetica','bold');
    doc.setTextColor(cc[0],cc[1],cc[2]);
    doc.text(title.toUpperCase(), M+5, y+4.8);
    y+=9;
  }

  // ── Data row ──
  let rowAlt=0;
  function dRow(label, value, opts){
    opts=opts||{};
    checkPage(7);
    const h=opts.tall?8:6;
    if(opts.alt===undefined?rowAlt%2===1:opts.alt){
      doc.setFillColor(BG_ALT[0],BG_ALT[1],BG_ALT[2]);
      doc.rect(M,y,CW,h,'F');
    }
    rowAlt++;
    const lx = opts.indent ? M+5 : M+2;
    doc.setFontSize(opts.bold?8.5:7.5);
    doc.setFont('helvetica',opts.bold?'bold':'normal');
    doc.setTextColor(opts.bold?BLACK[0]:DARK[0], opts.bold?BLACK[1]:DARK[1], opts.bold?BLACK[2]:DARK[2]);
    doc.text(label, lx, y+h-1.5);
    const vc=opts.col==='red'?RED:opts.col==='green'?GREEN:opts.col==='gold'?GOLD:opts.bold?BLACK:DARK;
    doc.setTextColor(vc[0],vc[1],vc[2]);
    doc.setFont('helvetica',opts.bold?'bold':'normal');
    doc.text(value, W-M-1, y+h-1.5, {align:'right'});
    y+=h;
  }

  function hairline(){
    doc.setDrawColor(BORDER[0],BORDER[1],BORDER[2]);
    doc.setLineWidth(0.2);
    doc.line(M,y,W-M,y);
    y+=1;
  }

  function gap(n){y+=n||2;}

  // ════════════════════════════════════════════════
  // PAGE 1

    ['02','Replacement of Domestic Items (RDIR)','info','Replacing sofas, white goods, carpets, curtains and beds — the replacement cost is fully deductible. The original purchase is NOT. Keep every receipt.'],
    ['03','Repairs vs Capital Improvements','warn','Repairs are fully deductible. Improvements are not (but reduce CGT on sale). Like-for-like boiler = repair. Loft conversion = improvement. HMRC scrutinise this hard.'],
    ...(structure==='personal'&&r.marginalRate>=40?[['04','Incorporate into Ltd Company (SPV)','warn','You are a '+r.marginalRate+'% taxpayer getting 20% interest relief. Incorporation restores full deductibility. Costs: SDLT + potential CGT on transfer. For new purchases always buy via Ltd from day one.']]:[]),
    ['05','Interest-Only Mortgage','info','With interest-only, 100% of your payment qualifies for the Section 24 credit. With repayment, the capital portion gets zero relief — it builds equity but nothing off your tax bill.'],
    ['06','Mortgage Arrangement Fees','good','Arrangement and broker fees are fully deductible as allowable expenses. Claim in full the year paid, or amortise if the lender adds them to the loan.'],
    ['07','Personal Allowance Trap (above £100k)','warn','Above £100k you lose £1 personal allowance per £2 earned — a 60% effective rate. Section 24 inflates your taxable profit and can push you over this threshold even on modest real cash profit.'],
    ['08','Loss Carry Forward','info','Tax losses carry forward indefinitely against future rental profits. Cannot offset other income. Track void periods and heavy repair years carefully.'],
    ['09','Making Tax Digital (MTD)','warn','From April 2026: mandatory for gross rental income above £50k. Quarterly digital submissions to HMRC. Get compliant software now — Landlord Studio, Xero or QuickBooks Property all work.'],
    ['10','Capital Gains Tax on Sale','info','CGT: 18% (basic) or 24% (higher rate) on residential gains. Annual exempt amount £3,000 for 2025/26. Consider timing in a low-income year, gifting to a lower-rate spouse, or Ltd structure. No main residence relief on BTL.'],
  ];

  // Two column tips layout
  const tCW=(CW-4)/2;
  const tL=M, tR=M+tCW+4;
  let leftTips=[], rightTips=[];
  tips.forEach((t,i)=>{ if(i%2===0) leftTips.push(t); else rightTips.push(t); });

  const maxTips=Math.max(leftTips.length,rightTips.length);
  for(let i=0;i<maxTips;i++){
    const drawTip=(t,x,w)=>{
      if(!t)return 0;
      const tc=t[2]==='warn'?[200,120,30]:t[2]==='good'?[40,140,80]:[60,100,180];
      const wrapped=doc.splitTextToSize(t[3],w-8);
      const bh=7+wrapped.length*3.8+3;
      // Light tinted background
      const bg=t[2]==='warn'?[255,250,242]:t[2]==='good'?[242,252,246]:[242,246,255];
      doc.setFillColor(bg[0],bg[1],bg[2]);
      doc.roundedRect(x,y,w,bh,1.5,1.5,'F');
      doc.setDrawColor(tc[0]+30,tc[1]+30,tc[2]+30);
      doc.setLineWidth(0.2);
      doc.roundedRect(x,y,w,bh,1.5,1.5,'S');
      doc.setFillColor(tc[0],tc[1],tc[2]);
      doc.roundedRect(x,y,3,bh,1,1,'F');
      // Number
      doc.setFontSize(6.5);doc.setFont('helvetica','bold');doc.setTextColor(tc[0],tc[1],tc[2]);
      doc.text(t[0],x+5,y+5);
      // Title
      doc.setFontSize(7.5);doc.setFont('helvetica','bold');doc.setTextColor(BLACK[0],BLACK[1],BLACK[2]);
      doc.text(t[1],x+12,y+5);
      // Body
      doc.setFontSize(6.5);doc.setFont('helvetica','normal');doc.setTextColor(DARK[0],DARK[1],DARK[2]);
      let ty=y+9;
      wrapped.forEach(ln=>{doc.text(ln,x+4,ty);ty+=3.8;});
      return bh+2;
    };

    const lh=leftTips[i]?doc.splitTextToSize(leftTips[i][3],tCW-8).length*3.8+12:0;
    const rh=rightTips[i]?doc.splitTextToSize(rightTips[i][3],tCW-8).length*3.8+12:0;
    const rowH=Math.max(lh,rh)+1;
    checkPage(rowH);
    drawTip(leftTips[i],tL,tCW);
    drawTip(rightTips[i],tR,tCW);
    y+=rowH;
  }

  // ── Footer every page ──
  const pages=doc.getNumberOfPages();
  for(let p=1;p<=pages;p++){
    doc.setPage(p);
    doc.setDrawColor(BORDER[0],BORDER[1],BORDER[2]);
    doc.setLineWidth(0.3);
    doc.line(M,287,W-M,287);
    doc.setFontSize(6.5);doc.setFont('helvetica','normal');doc.setTextColor(LIGHT[0],LIGHT[1],LIGHT[2]);
    doc.text('BuTLer  |  gd7vibe.github.io/btl-calculator  |  For illustrative purposes only — consult a qualified accountant',M,291);
    doc.text('Page '+p+' of '+pages,W-M,291,{align:'right'});
  }

  const filename='BuTLer-Report-'+now.getFullYear()+('0'+(now.getMonth()+1)).slice(-2)+('0'+now.getDate()).slice(-2)+'.pdf';
  doc.save(filename);
}

// ── Render ──
function render(){
  const r=calc();
  const profitable=r.netCF>0;
  const {tab,structure}=state;
  const desktop=window.innerWidth>=800;
  const navItems=[{i:"📋",l:"Inputs"},{i:"📊",l:"Results"},{i:"🎯",l:"Optimise"}];

  const header=`<div class="header">
    <div class="header-inner">
      <span class="header-logo">🏠</span>
      <div>
        <div class="header-title">BuTLer</div>
        <div class="header-sub">UK Buy-to-Let Tax · 2025/26 · Section 24</div>
      </div>
      ${desktop?`
        <div class="header-tabs" style="display:flex;margin-left:auto;gap:8px;align-items:center">
          <button class="tab-btn${tab!==2?' active':''}" onclick="setTab(1)">📊 Results</button>
          <button class="tab-btn${tab===2?' active':''}" onclick="setTab(2)">🎯 Optimise</button>
          <button class="pdf-btn" onclick="exportPDF()" style="margin-left:8px">📄 Export PDF</button>
          <div class="desktop-net-box${profitable?"":" loss"}" style="margin-left:16px">
            <div class="desktop-net-label">Net / Month</div>
            <div class="desktop-net-val" style="color:${profitable?"#3dba82":"#e05555"}">${fmt(r.netPCM)}</div>
          </div>
        </div>
      `:`
        <div class="header-right" style="margin-left:auto;text-align:right">
          <div class="header-net-label">NET/MONTH</div>
          <div class="header-net-val" style="color:${profitable?"#3dba82":"#e05555"}">${fmt(r.netPCM)}</div>
        </div>
      `}
    </div>
  </div>`;

  let body="";
  if(desktop){
    // On desktop: left=always inputs, right=results (tab 0 or 1) or optimise (tab 2)
    const right=tab===2?optimiseHTML(r,structure,state.mortPCM):resultsHTML(r,structure);
    body=`<div class="body" style="display:flex;gap:24px;align-items:flex-start;max-width:1200px;margin:0 auto;padding:24px 32px 32px">
      <div class="col-left" style="flex:0 0 420px;min-width:0">${inputsHTML()}</div>
      <div class="col-right" style="flex:1;min-width:0">${right}</div>
    </div>`;
  } else {
    const mobileNav=`<div class="bottom-nav">
      ${navItems.map((n,i)=>`<button class="nav-btn" onclick="setTab(${i})">
        <span class="nav-icon">${n.i}</span>
        <span class="nav-label" style="color:${tab===i?"#c9a84c":"#7a7f96"};font-weight:${tab===i?700:400}">${n.l}</span>
        ${tab===i?`<div class="nav-bar" style="display:block"></div>`:""}
      </button>`).join("")}
    </div>`;
    let content="";
    if(tab===0)content=inputsHTML()+`<button class="calc-btn" style="width:100%;background:#c9a84c;color:#000;border:none;border-radius:10px;padding:15px;font-size:16px;font-weight:700;margin-bottom:16px;display:block" onclick="setTab(1)">Calculate Results →</button>`;
    if(tab===1)content=resultsHTML(r,structure)+`<button onclick="exportPDF()" style="width:100%;background:#c9a84c;color:#000;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;margin-bottom:16px;display:block">📄 Export PDF Report</button>`;
    if(tab===2)content=optimiseHTML(r,structure,state.mortPCM);
    body=`<div class="body" style="padding:14px 14px 0;max-width:480px;margin:0 auto">${content}</div>${mobileNav}`;
  }

  document.getElementById("app").innerHTML=`<div style="min-height:100vh;padding-bottom:${desktop?0:72}px">${header}${body}</div>`;
  rebindFields();
}

// ── Field interaction ──
function fieldFocus(id,el){
  const fw=document.getElementById("fw-"+id);
  if(fw)fw.classList.add("focused");
  const v=String(state[id]||"");
  el.value=v==="0"?"":v;
  el.setSelectionRange(0,el.value.length);
}
function fieldBlur(id,el){
  const fw=document.getElementById("fw-"+id);
  if(fw)fw.classList.remove("focused");
  const n=parseFloat(el.value);
  const final=isNaN(n)?0:n;
  state[id]=final;
  el.value=final===0?"":String(final);
  render();
}
function fieldInput(id,el){
  let v=el.value.replace(/[^0-9.]/g,"");
  const d=v.indexOf(".");
  if(d!==-1)v=v.slice(0,d+1)+v.slice(d+1).replace(/\./g,"");
  if(v.length>1&&v[0]==="0"&&v[1]!==".")v=v.replace(/^0+/,"")||"0";
  el.value=v;
  const n=parseFloat(v);
  if(!isNaN(n)){state[id]=n;}
  // Update header net/month live without full re-render
  const r=calc();
  const profitable=r.netCF>0;
  const netEls=document.querySelectorAll(".header-net-val,.desktop-net-val");
  netEls.forEach(e=>{e.textContent=fmt(r.netPCM);e.style.color=profitable?"#3dba82":"#e05555";});
}

function rebindFields(){
  // Fields are rebound via inline handlers on each render — nothing extra needed
}

function pick(id,val){
  state[id]=val;
  render();
}
function setTab(i){
  state.tab=i;
  render();
  window.scrollTo(0,0);
}
function toggleAcc(id){
  state.acc[id]=!state.acc[id];
  render();
}

// ── Resize handler ──
let resizeTimer;
window.addEventListener("resize",()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(render,100);
});

// ── Boot ──
render();
</script>
</body>
</html>
